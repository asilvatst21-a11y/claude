name: Build and deploy matriculas-whatsapp to Azure Web App - painelanalitico

on:
  push:
    branches:
      - claude/start-new-project-znnaq
    paths:
      - 'matriculas-whatsapp/**'
      - '.github/workflows/azure-deploy-painelanalitico.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: matriculas-whatsapp

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install and build
        run: |
          npm ci
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ZAPI_INSTANCE: ${{ secrets.VITE_ZAPI_INSTANCE }}
          VITE_ZAPI_TOKEN: ${{ secrets.VITE_ZAPI_TOKEN }}
          VITE_ZAPI_CLIENT_TOKEN: ${{ secrets.VITE_ZAPI_CLIENT_TOKEN }}

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: matriculas-whatsapp

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'painelanalitico'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
